<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Session Board</title>
<style>
:root{--bg:#f6f5f1;--col:#eeede7;--card:#fff;--ink:#2e2c27;--soft:#5f5e57;--grey:#9a998f;--line:#e1e0d8;
--accent:#c6613f;--run:#3f8f6b;--wait:#b8901a;--idle:#8a8a80;--slack:#7c4dbd;--chip:#f1f0ea;
--crit:#c6613f;--bug:#c9a227;--map:#4d7fbd;--other:#8a8a80}
@media (prefers-color-scheme:dark){:root{--bg:#191917;--col:#21201d;--card:#2a2926;--ink:#ecebe5;--soft:#b5b4ac;
--grey:#77766e;--line:#373631;--chip:#33322e}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",sans-serif;
display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:600}
.meta{color:var(--soft);font-size:13px}
input[type=search]{margin-left:auto;padding:7px 11px;border:1px solid var(--line);border-radius:6px;
background:var(--card);color:var(--ink);width:240px;font:inherit;font-size:14px}
.wrap{flex:1;display:grid;grid-template-columns:1fr 8px var(--aside-w,560px);min-height:0}
.split{cursor:col-resize;background:var(--line);position:relative}
.split::after{content:"";position:absolute;left:2px;right:2px;top:50%;height:40px;margin-top:-20px;border-radius:2px;
border-left:1px solid var(--grey);border-right:1px solid var(--grey)}
.split:hover,.split.active{background:var(--accent)}
body.resizing{cursor:col-resize;user-select:none}
.ctrls{display:flex;gap:4px;align-items:center;margin-top:8px;flex-wrap:wrap}
.ctrls button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:5px;
padding:2px 9px;font:500 13px -apple-system,sans-serif;cursor:pointer}
.ctrls button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.ctrls span{color:var(--grey);font-size:12px;margin:0 4px 0 8px}
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr)) 190px;gap:10px;padding:14px 16px;overflow:auto;align-items:start}
.col{background:var(--col);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.col.over{outline:2px dashed var(--accent);outline-offset:-4px}
.col h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin:2px 4px 2px;color:var(--ink);
border-bottom:3px solid var(--other);padding-bottom:5px}
.col[data-col=critical] h2{border-color:var(--crit)}
.col[data-col=bugs] h2{border-color:var(--bug)}
.col[data-col=map] h2{border-color:var(--map)}
.col[data-col=done] h2{border-color:var(--line)}
.col h2 small{display:block;font-weight:400;text-transform:none;letter-spacing:0;color:var(--grey);font-size:12px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:grab}
.card.dragging{opacity:.4}
.card.flash{box-shadow:0 0 0 2px var(--accent)}
.col[data-col=done] .card{opacity:.6;padding:7px 10px}
.col[data-col=done] .card .next,.col[data-col=done] .card .tags,.col[data-col=done] .card .sub{display:none}
.top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.status{font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;color:#fff;background:var(--idle);text-transform:uppercase;letter-spacing:.03em}
.status.needs{background:var(--accent)}
.status.running{background:var(--run)}
.status.waiting{background:var(--wait)}
.kind{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--soft)}
.kind.slack{background:var(--slack);color:#fff}
.kind.task{background:#2f8f8f;color:#fff}
.status.task{background:#2f8f8f}
.lname{cursor:text;outline:none;border-radius:3px}
.lname[contenteditable=true],.headline[contenteditable=true]{background:var(--card);box-shadow:0 0 0 2px var(--accent);padding:0 3px}
.count{color:var(--grey);font-weight:500}
.lx{float:right;border:0;background:none;color:var(--grey);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.lx:hover,.lx[data-armed]{color:var(--accent);font-size:12px}
.addtask{width:100%;padding:7px 9px;border:1px dashed var(--grey);border-radius:7px;background:transparent;
color:var(--ink);font:inherit;font-size:14px}
.addtask:focus{outline:none;border-style:solid;border-color:var(--accent);background:var(--card)}
.note{width:100%;min-height:54px;margin-top:4px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;
background:var(--bg);color:var(--ink);font:inherit;font-size:13.5px;resize:vertical}
.addlane{display:flex;justify-content:center;padding-top:8px}
.addlane button{width:100%;padding:10px 6px;border:1px dashed var(--grey);border-radius:10px;background:transparent;
color:var(--soft);font:500 13px -apple-system,sans-serif;cursor:pointer}
.addlane button:hover{border-color:var(--accent);color:var(--accent)}
.age{color:var(--grey);font-size:12px;margin-left:auto;white-space:nowrap}
.headline{font-weight:650;font-size:16px;margin-top:6px;line-height:1.3;word-break:break-word}
.sub{color:var(--grey);font-size:12.5px;margin-top:2px;word-break:break-all}
.live{color:var(--run);font-weight:500}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--run);margin-right:3px}
.dot.busy{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.next{margin-top:8px;padding:7px 9px;border-radius:6px;border-left:4px solid var(--accent);
background:color-mix(in srgb,var(--accent) 13%,var(--card));font-weight:550;font-size:14.5px;line-height:1.35}
.next::before{content:"NEXT";display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--accent);margin-bottom:1px}
.stale{color:var(--grey);font-size:12px;font-style:normal;font-weight:400}
.detail{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--soft);font-size:13.5px}
.detail p{margin:0 0 6px}
.card.open .detail{display:block}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;align-items:center}
.tag{background:var(--chip);border-radius:4px;padding:1px 7px;font-size:12px;color:var(--soft);text-decoration:none}
a.tag:hover{color:var(--ink)}
.tag.new{background:var(--accent);color:#fff}
.go{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:5px;text-decoration:none;
padding:3px 9px;font:500 12.5px -apple-system,sans-serif;cursor:pointer;margin-left:auto}
.go:hover{border-color:var(--ink)}
.empty{color:var(--grey);text-align:center;padding:16px 0;font-size:13px}
aside{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--card)}
aside .head{padding:12px 16px;border-bottom:1px solid var(--line)}
aside .head h2{margin:0;font-size:16px}
aside .head p{margin:3px 0 0;color:var(--soft);font-size:13px}
aside .head a{color:var(--soft)}
.days{display:grid;grid-template-columns:48px repeat(var(--ndays,3),1fr);border-bottom:1px solid var(--line)}
.days div{padding:7px 6px;font-size:13px;font-weight:600;border-left:1px solid var(--line)}
.days div:first-child{border-left:0}
.days .today{color:var(--accent)}
.scroll{overflow:auto;flex:1}
.grid{display:grid;grid-template-columns:48px repeat(var(--ndays,3),1fr);position:relative}
.hours{position:relative}
.hours span{position:absolute;right:6px;font-size:11.5px;color:var(--grey);transform:translateY(-50%)}
.daycol{position:relative;border-left:1px solid var(--line)}
.daycol.over{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.daycol.night{background:repeating-linear-gradient(transparent 0,transparent 0)}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.hr.half{border-top-style:dotted;opacity:.55}
.box{position:absolute;left:3px;right:3px;border-radius:6px;padding:3px 18px 3px 7px;font-size:12.5px;overflow:hidden;
background:var(--col);border-left:4px solid var(--other);cursor:move;user-select:none;z-index:2;line-height:1.25}
.box[data-cat=critical]{border-left-color:var(--crit)}
.box[data-cat=bugs]{border-left-color:var(--bug)}
.box[data-cat=map]{border-left-color:var(--map)}
.box[data-cat=done]{opacity:.5;text-decoration:line-through}
.box.dragging{opacity:.75;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:5}
.box .t{color:var(--soft);font-size:11px}
.box .bt{font-weight:600;outline:none}
.box .x{position:absolute;right:2px;top:1px;cursor:pointer;color:var(--grey);border:0;background:none;font-size:15px;padding:0 3px}
.box .rs{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.now{position:absolute;left:-3px;right:0;border-top:2px solid var(--accent);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
padding:7px 13px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;font-size:14px}
.toast.show{opacity:1}
@media (max-width:1100px){.wrap{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line);min-height:600px}
.board{grid-template-columns:repeat(5,80vw)}}
</style>
</head>
<body>
<header>
  <h1>Session Board</h1>
  <span class="meta" id="meta">loading…</span>
  <span class="meta" id="slackmeta"></span>
  <input type="search" id="q" placeholder="Filter by title, repo, PR…">
</header>
<div class="wrap">
  <main class="board" id="board"></main>
  <div class="split" id="split" title="Drag to resize the calendar"></div>
  <aside>
    <div class="head">
      <h2>Time boxes</h2>
      <p id="boxsum">Drag cards onto a day and time. Double-click empty time for a custom block.</p>
      <div class="ctrls">
        <span>Days</span>
        <button data-days="3">3</button><button data-days="5">5</button><button data-days="7">7</button>
        <span>Zoom</span>
        <button id="zout" title="Shorter hours">−</button><button id="zin" title="Taller hours">+</button>
      </div>
    </div>
    <div class="days" id="days"></div>
    <div class="scroll" id="scroll"><div class="grid" id="grid"></div></div>
  </aside>
</div>
<div class="toast" id="toast"></div>
<script>
const DEFAULT_LANES = [
  {id: "critical", name: "Critical & blocking",  hint: "someone or something is blocked on it"},
  {id: "bugs",     name: "Iterative bug fixing", hint: "debugging, CI, review loops"},
  {id: "map",      name: "Map of work",          hint: "planning, design, feature building"},
  {id: "other",    name: "Others",               hint: "tooling, config, one-offs"},
];
const DONE_LANE = {id: "done", name: "Done", hint: "drag here"};
// Cards with nowhere else to go land in these, so they can be renamed but not deleted
const FIXED_LANES = new Set(["other", "done"]);
const lanes = () => [...state.lanes, {...DONE_LANE, ...(state.doneName ? {name: state.doneName} : {})}];
const laneIds = () => new Set(lanes().map(l => l.id));
const CATEGORY_COL = {critical_blocking: "critical", bug_fixing: "bugs", map_of_work: "map", other: "other"};
const STATUS = {
  needs:   {label: "Needs you", rank: 0},
  running: {label: "Running",   rank: 1},
  waiting: {label: "Waiting",   rank: 2},
  idle:    {label: "Idle",      rank: 3},
  task:    {label: "To-do",     rank: 0.5},
};
// Served by the local server: same origin. Served from GitHub Pages: talk to the local server
const API = ["localhost", "127.0.0.1"].includes(location.hostname) ? "" : "http://localhost:8765";
const SNAP = 15, DAY_MIN = 1440;
const pref = (k, d) => { try { const v = localStorage.getItem("tb-" + k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } };
const setPref = (k, v) => { try { localStorage.setItem("tb-" + k, JSON.stringify(v)); } catch (_) {} };
let NDAYS = pref("days", 3), PX = pref("px", 0.9);
let items = [], state = {placed: {}, boxes: {}, tasks: {}, lanes: DEFAULT_LANES}, now = Date.now() / 1000, slackSync = null;
let busyUI = false;
const expanded = new Set();

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const ago = t => {
  const d = Math.max(0, now - t);
  if (d < 60) return "now";
  if (d < 3600) return Math.floor(d / 60) + "m";
  if (d < 86400) return Math.floor(d / 3600) + "h";
  return Math.floor(d / 86400) + "d";
};
const hhmm = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const pretty = m => {
  m = ((m % DAY_MIN) + DAY_MIN) % DAY_MIN;
  const h = Math.floor(m / 60), mm = m % 60, h12 = ((h + 11) % 12) + 1;
  return `${h12}${mm ? ":" + String(mm).padStart(2, "0") : ""}${h < 12 ? "am" : "pm"}`;
};
const toMin = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const dayKey = offset => { const d = new Date(); d.setDate(d.getDate() + offset); return d.toLocaleDateString("en-CA"); };
const firstWords = (s, n) => (s || "").split(/\s+/).slice(0, n).join(" ");

function sessionStatus(s) {
  if (s.live && s.live.status === "busy") return "running";
  const w = s.ai && s.ai.waiting_on;
  if (w === "you" || (!w && s.asks_you)) return "needs";
  if (w === "ci_or_review" || w === "someone_else") return "waiting";
  return "idle";
}

function toItems(sessions, slack) {
  const out = sessions.map(s => ({
    key: "s:" + s.session_id, kind: "session", s, at: s.active_at,
    headline: (s.ai && s.ai.headline) || s.title,
    auto: CATEGORY_COL[s.ai && s.ai.category] || "other",
    status: sessionStatus(s),
    search: [s.title, s.repo, s.branch, s.first_ask, s.ai && s.ai.summary, s.ai && s.ai.headline, ...s.prs].join(" "),
  }));
  for (const m of slack) {
    out.push({key: "k:" + m.id, kind: "slack", m, at: Number(m.ts) || now,
      headline: m.headline || firstWords(m.ask, 5), auto: CATEGORY_COL[m.category] || "other", status: "needs",
      search: [m.who, m.where, m.summary, m.ask, m.headline].join(" ")});
  }
  for (const t of Object.values(state.tasks)) {
    out.push({key: "t:" + t.id, kind: "task", t, at: t.created, headline: t.title, auto: t.lane, status: "task",
      search: [t.title, t.note].join(" ")});
  }
  return out;
}

// A drag holds until the item gets new activity after it; a deleted lane falls back to Others
function colOf(it) {
  const ids = laneIds(), p = state.placed[it.key];
  if (p && it.at <= p.at + 5 && ids.has(p.col)) return {col: p.col, pinned: true};
  return {col: ids.has(it.auto) ? it.auto : "other", fresh: !!p && it.kind !== "task"};
}

let lastSessions = [], lastSlack = [];
function rebuildItems() {
  items = toItems(lastSessions, lastSlack);
}

function addTask(lane, title) {
  const id = Date.now().toString(36);
  state.tasks[id] = {id, title, lane, note: "", created: Date.now() / 1000};
  rebuildItems(); save(); render();
}

function editable(node, onDone) {
  node.contentEditable = "true";
  node.spellcheck = false;
  node.focus();
  document.getSelection().selectAllChildren(node);
  busyUI = true;
  let finished = false;
  const finish = keep => {
    if (finished) return;
    finished = true;
    node.contentEditable = "false";
    busyUI = false;
    const v = node.textContent.trim();
    if (keep && v) onDone(v);
    else render();
  };
  node.onkeydown = e => {
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    if (e.key === "Escape") finish(false);
  };
  node.onblur = () => finish(true);
}

function goTerminal(s) {
  fetch(API + "/api/focus", {method: "POST", body: JSON.stringify({session_id: s.session_id})})
    .then(r => r.json())
    .then(r => toast(r.ok ? (r.action === "focused" ? "Switched to its Terminal tab" : "Opened in a new Terminal tab")
                          : "Couldn't switch: " + (r.error || "error")));
}

function card(it, info) {
  const c = el("div", "card" + (expanded.has(it.key) ? " open" : ""));
  c.draggable = true;
  c.dataset.key = it.key;
  const top = el("div", "top");
  top.appendChild(el("span", "status " + it.status, STATUS[it.status].label));
  const kindLabel = {slack: "Slack", session: "Claude", task: "Mine"}[it.kind];
  top.appendChild(el("span", "kind " + it.kind, kindLabel));
  top.appendChild(el("span", "age", ago(it.at)));
  c.appendChild(top);
  const hl = el("div", "headline", it.headline);
  c.appendChild(hl);
  const tags = el("div", "tags");
  if (info.fresh) tags.appendChild(el("span", "tag new", "new activity"));
  const detail = el("div", "detail");

  if (it.kind === "session") {
    const s = it.s;
    const sub = el("div", "sub", [s.title, s.repo, s.branch].filter(Boolean).join(" · "));
    if (s.live) {
      const lv = el("span", "live");
      lv.append(" · ", el("span", "dot" + (s.live.status === "busy" ? " busy" : "")),
        (s.live.tty || "").replace("/dev/", "") || "open" ,
        s.live.status === "shell" ? " · background cmd" : "");
      sub.appendChild(lv);
    }
    c.appendChild(sub);
    if (s.ai && s.ai.next_step) {
      const nx = el("div", "next", s.ai.next_step);
      if (s.ai.active_at < s.active_at || s.ai.v !== 2) nx.appendChild(el("span", "stale", " (updating…)"));
      c.appendChild(nx);
    } else {
      c.appendChild(el("div", "sub", "Summarizing…"));
    }
    if (s.ai && s.ai.summary) detail.appendChild(el("p", null, s.ai.summary));
    const you = el("p"); you.append(el("b", null, "You: "), s.recent_asks.at(-1) || s.first_ask);
    const cl = el("p"); cl.append(el("b", null, "Claude: "), s.last_reply || "…");
    detail.append(you, cl);
    for (const u of s.prs.slice(-3)) {
      const a = el("a", "tag", "#" + u.split("/").pop());
      a.href = u; a.target = "_blank"; a.rel = "noopener"; a.title = u.replace("https://github.com/", "");
      tags.appendChild(a);
    }
    const go = el("button", "go", s.live ? "Go to terminal" : "Open in Terminal");
    go.title = s.live ? "Switch to the Terminal tab running this session" : "Open a new Terminal tab and resume this session";
    go.onclick = e => { e.stopPropagation(); goTerminal(s); };
    tags.appendChild(go);
  } else if (it.kind === "task") {
    const t = it.t;
    hl.title = "Double-click to rename";
    hl.ondblclick = e => { e.stopPropagation(); editable(hl, v => { t.title = v; rebuildItems(); save(); render(); }); };
    if (t.note) c.appendChild(el("div", "sub", t.note));
    const note = el("textarea", "note");
    note.placeholder = "Add a note…";
    note.value = t.note || "";
    note.onclick = e => e.stopPropagation();
    note.onblur = () => { t.note = note.value.trim(); save(); render(); };
    detail.appendChild(note);
    const del = el("button", "go", "Delete");
    del.onclick = e => {
      e.stopPropagation();
      if (del.dataset.armed) {
        delete state.tasks[t.id];
        for (const b of Object.values(state.boxes)) if (b.key === it.key) delete state.boxes[b.id];
        rebuildItems(); save(); render();
      } else { del.dataset.armed = "1"; del.textContent = "Click again to delete"; }
    };
    tags.appendChild(del);
  } else {
    const m = it.m;
    c.appendChild(el("div", "sub", [m.who, m.where].filter(Boolean).join(" · ")));
    c.appendChild(el("div", "next", m.ask));
    detail.appendChild(el("p", null, m.summary));
    if (m.url && m.url.startsWith("https://")) {
      const a = el("a", "go", "Open in Slack");
      a.href = m.url; a.target = "_blank"; a.rel = "noopener";
      a.onclick = e => e.stopPropagation();
      tags.appendChild(a);
    }
  }
  c.append(detail, tags);
  c.onclick = e => {
    if (e.target.closest("a,button")) return;
    expanded.has(it.key) ? expanded.delete(it.key) : expanded.add(it.key);
    c.classList.toggle("open");
  };
  c.ondragstart = e => { busyUI = true; c.classList.add("dragging"); e.dataTransfer.setData("text/plain", it.key); };
  c.ondragend = () => { busyUI = false; c.classList.remove("dragging"); };
  return c;
}

function laneHeader(c, count) {
  const h = el("h2");
  const name = el("span", "lname", c.name);
  name.title = "Double-click to rename";
  name.ondblclick = () => editable(name, v => {
    if (c.id === "done") state.doneName = v;
    else state.lanes.find(l => l.id === c.id).name = v;
    save(); render();
  });
  h.append(name, el("span", "count", ` · ${count}`));
  if (!FIXED_LANES.has(c.id)) {
    const x = el("button", "lx", "×");
    x.title = "Delete lane";
    x.onclick = () => {
      if (!x.dataset.armed) { x.dataset.armed = "1"; x.textContent = "delete?"; return; }
      state.lanes = state.lanes.filter(l => l.id !== c.id);
      for (const t of Object.values(state.tasks)) if (t.lane === c.id) t.lane = "other";
      for (const [k, p] of Object.entries(state.placed)) if (p.col === c.id) delete state.placed[k];
      rebuildItems(); save(); render();
    };
    h.appendChild(x);
  }
  if (c.hint) h.appendChild(el("small", null, c.hint));
  return h;
}

function addTaskInput(laneId) {
  const inp = el("input", "addtask");
  inp.placeholder = "+ Add to-do";
  inp.onkeydown = e => {
    if (e.key === "Enter" && inp.value.trim()) {
      const v = inp.value.trim();
      addTask(laneId, v);
      const again = document.querySelector(`.col[data-col="${laneId}"] .addtask`);
      if (again) again.focus();
    }
    if (e.key === "Escape") { inp.value = ""; inp.blur(); }
  };
  return inp;
}

function addLaneColumn() {
  const wrap = el("div", "addlane");
  const b = el("button", null, "+ Add lane");
  b.onclick = () => {
    const id = "lane" + Date.now().toString(36);
    const otherIdx = state.lanes.findIndex(l => l.id === "other");
    state.lanes.splice(otherIdx < 0 ? state.lanes.length : otherIdx, 0, {id, name: "New lane", hint: ""});
    save(); render();
    const name = document.querySelector(`.col[data-col="${id}"] .lname`);
    if (name) editable(name, v => { state.lanes.find(l => l.id === id).name = v; save(); render(); });
  };
  wrap.appendChild(b);
  return wrap;
}

function renderBoard() {
  const q = document.getElementById("q").value.toLowerCase().trim();
  const board = document.getElementById("board");
  board.replaceChildren();
  const all = lanes();
  board.style.gridTemplateColumns = `repeat(${all.length - 1}, minmax(250px,1fr)) 120px 190px`;
  const groups = Object.fromEntries(all.map(c => [c.id, []]));
  for (const it of items) {
    if (q && !it.search.toLowerCase().includes(q)) continue;
    const info = colOf(it);
    groups[info.col].push([it, info]);
  }
  for (const c of all) {
    if (c.id === "done") board.appendChild(addLaneColumn());
    groups[c.id].sort((a, b) => STATUS[a[0].status].rank - STATUS[b[0].status].rank || b[0].at - a[0].at);
    const col = el("section", "col");
    col.dataset.col = c.id;
    col.appendChild(laneHeader(c, groups[c.id].length));
    if (c.id !== "done") col.appendChild(addTaskInput(c.id));
    if (!groups[c.id].length) col.appendChild(el("div", "empty", "—"));
    for (const [it, info] of groups[c.id]) col.appendChild(card(it, info));
    col.ondragover = e => { e.preventDefault(); col.classList.add("over"); };
    col.ondragleave = () => col.classList.remove("over");
    col.ondrop = e => {
      e.preventDefault();
      col.classList.remove("over");
      const it = items.find(x => x.key === e.dataTransfer.getData("text/plain"));
      if (!it) return;
      if (it.kind === "task") it.t.lane = c.id;
      else if (c.id === it.auto) delete state.placed[it.key];
      else state.placed[it.key] = {col: c.id, at: it.at};
      rebuildItems(); save(); render();
    };
    board.appendChild(col);
  }
  const needs = items.filter(i => i.status === "needs" && colOf(i).col !== "done").length;
  const running = items.filter(i => i.status === "running").length;
  document.getElementById("meta").textContent =
    `${items.filter(i => i.kind === "session").length} sessions · ${running} running · ${needs} need you · ` +
    `updated ${new Date().toLocaleTimeString([], {hour: "numeric", minute: "2-digit"})}`;
  document.title = needs ? `(${needs}) Session Board` : "Session Board";
  document.getElementById("slackmeta").textContent = slackSync ? `Slack synced ${ago(slackSync)} ago` : "Slack not synced yet";
}

function renderTimeline() {
  const days = document.getElementById("days"), grid = document.getElementById("grid");
  document.querySelector("aside").style.setProperty("--ndays", NDAYS);
  days.replaceChildren(el("div"));
  grid.replaceChildren();
  grid.style.height = DAY_MIN * PX + "px";
  const hours = el("div", "hours");
  for (let h = 1; h < 24; h++) {
    const s = el("span", null, pretty(h * 60));
    s.style.top = h * 60 * PX + "px";
    hours.appendChild(s);
  }
  grid.appendChild(hours);
  const d = new Date(), nm = d.getHours() * 60 + d.getMinutes();
  let total = 0;
  for (let i = 0; i < NDAYS; i++) {
    const key = dayKey(i), date = new Date(key + "T00:00");
    days.appendChild(el("div", i === 0 ? "today" : null,
      (i === 0 ? "Today · " : "") + date.toLocaleDateString([], {weekday: "short", month: "short", day: "numeric"})));
    const col = el("div", "daycol");
    col.dataset.date = key;
    for (let m = 30; m < DAY_MIN; m += 30) {
      const h = el("div", "hr" + (m % 60 ? " half" : ""));
      h.style.top = m * PX + "px";
      col.appendChild(h);
    }
    if (i === 0) {
      const n = el("div", "now");
      n.style.top = nm * PX + "px";
      col.appendChild(n);
    }
    for (const b of Object.values(state.boxes).filter(b => b.date === key)) {
      total += b.dur;
      col.appendChild(boxEl(b));
    }
    setupDayCol(col);
    grid.appendChild(col);
  }
  const p = document.getElementById("boxsum");
  p.replaceChildren(`${(total / 60).toFixed(1)}h boxed over the next ${NDAYS} days · `,
    Object.assign(el("a", null, "export .ics"), {href: API + "/today.ics"}));
}

function boxEl(b) {
  const it = items.find(x => x.key === b.key);
  const box = el("div", "box");
  box.dataset.cat = it ? colOf(it).col : "other";
  box.style.top = toMin(b.start) * PX + "px";
  box.style.height = Math.max(b.dur * PX - 2, 16) + "px";
  const t = el("div", "t", `${pretty(toMin(b.start))}–${pretty(toMin(b.start) + b.dur)}`);
  const bt = el("div", "bt", it ? it.headline : b.title);
  if (!b.key) {
    bt.contentEditable = "true";
    bt.onblur = () => { b.title = bt.textContent.trim() || "Focus block"; save(); };
    bt.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); bt.blur(); } };
  }
  const x = el("button", "x", "×");
  x.title = "Remove block";
  x.onclick = e => { e.stopPropagation(); delete state.boxes[b.id]; save(); renderTimeline(); };
  const rs = el("div", "rs");
  box.append(t, bt, x, rs);
  box.ondblclick = e => {
    e.stopPropagation();
    if (it && it.kind === "session") goTerminal(it.s);
    else if (it && it.kind === "slack" && it.m.url) window.open(it.m.url, "_blank", "noopener");
  };
  box.onclick = () => {
    if (box.dataset.moved) return;
    const c = document.querySelector(`.card[data-key="${CSS.escape(b.key || "")}"]`);
    if (!c) return;
    c.scrollIntoView({behavior: "smooth", block: "center"});
    c.classList.add("flash"); setTimeout(() => c.classList.remove("flash"), 1200);
  };
  dragBox(box, b, rs, t);
  return box;
}

// Move or resize a block with the mouse; moving sideways changes its day
function dragBox(box, b, handle, label) {
  box.onmousedown = e => {
    if (e.target.closest(".x") || e.target.isContentEditable) return;
    e.preventDefault();
    const resize = e.target === handle, y0 = e.clientY, s0 = toMin(b.start), d0 = b.dur, d0date = b.date;
    let moved = false;
    busyUI = true;
    delete box.dataset.moved;
    const mv = ev => {
      const dm = Math.round((ev.clientY - y0) / PX / SNAP) * SNAP;
      if (resize) {
        b.dur = Math.max(SNAP, Math.min(d0 + dm, DAY_MIN - s0));
        box.style.height = (b.dur * PX - 2) + "px";
      } else {
        const ns = Math.max(0, Math.min(s0 + dm, DAY_MIN - b.dur));
        b.start = hhmm(ns);
        box.style.top = ns * PX + "px";
        box.style.pointerEvents = "none";
        const under = document.elementFromPoint(ev.clientX, ev.clientY);
        box.style.pointerEvents = "";
        const col = under && under.closest(".daycol");
        if (col && col.dataset.date !== b.date) { b.date = col.dataset.date; col.appendChild(box); }
      }
      moved = moved || dm !== 0 || b.date !== d0date;
      box.classList.add("dragging");
      label.textContent = `${pretty(toMin(b.start))}–${pretty(toMin(b.start) + b.dur)}`;
    };
    const up = () => {
      document.removeEventListener("mousemove", mv);
      document.removeEventListener("mouseup", up);
      box.classList.remove("dragging");
      busyUI = false;
      if (moved) { box.dataset.moved = "1"; save(); renderTimeline(); }
    };
    document.addEventListener("mousemove", mv);
    document.addEventListener("mouseup", up);
  };
}

function minuteAt(col, e) {
  const r = col.getBoundingClientRect();
  const m = (e.clientY - r.top) / PX;
  return Math.max(0, Math.min(Math.round(m / SNAP) * SNAP, DAY_MIN - SNAP));
}

function setupDayCol(col) {
  col.ondragover = e => { e.preventDefault(); col.classList.add("over"); };
  col.ondragleave = () => col.classList.remove("over");
  col.ondrop = e => {
    e.preventDefault();
    col.classList.remove("over");
    const it = items.find(x => x.key === e.dataTransfer.getData("text/plain"));
    if (!it) return;
    const start = minuteAt(col, e), id = "b" + Date.now().toString(36), dur = Math.min(60, DAY_MIN - start);
    state.boxes[id] = {id, key: it.key, title: it.headline, date: col.dataset.date, start: hhmm(start), dur};
    save(); renderTimeline();
    toast(`Boxed ${pretty(start)}–${pretty(start + dur)}`);
  };
  col.ondblclick = e => {
    if (e.target.closest(".box")) return;
    const start = minuteAt(col, e), id = "b" + Date.now().toString(36);
    state.boxes[id] = {id, key: null, title: "Focus block", date: col.dataset.date, start: hhmm(start), dur: 30};
    save(); renderTimeline();
    const bt = [...document.querySelectorAll(`.daycol[data-date="${col.dataset.date}"] .bt[contenteditable]`)].pop();
    if (bt) { bt.focus(); document.getSelection().selectAllChildren(bt); }
  };
}

function render() { renderBoard(); renderTimeline(); }

async function save() {
  try { await fetch(API + "/api/state", {method: "POST", body: JSON.stringify(state)}); }
  catch (_) { toast("Couldn't save, is the server running?"); }
}

const typing = () => {
  const a = document.activeElement;
  return a && a.id !== "q" && (a.matches("input,textarea") || a.isContentEditable);
};

async function refresh() {
  if (busyUI || typing()) return;
  try {
    const [d, st, sl] = await Promise.all(["/api/sessions", "/api/state", "/api/slack"].map(u => fetch(API + u).then(r => r.json())));
    now = d.now;
    state = {placed: st.placed || {}, boxes: st.boxes || {}, tasks: st.tasks || {},
             lanes: st.lanes && st.lanes.length ? st.lanes : DEFAULT_LANES.map(l => ({...l})), doneName: st.doneName};
    slackSync = sl.synced_at;
    lastSessions = d.sessions;
    lastSlack = sl.items || [];
    rebuildItems();
    if (!busyUI) render();
  } catch (_) {
    document.getElementById("meta").textContent = "server not reachable, run: python3 ~/timebox/server.py";
  }
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1600);
}

function setupControls() {
  const wrap = document.querySelector(".wrap"), split = document.getElementById("split");
  const setW = w => wrap.style.setProperty("--aside-w", Math.max(320, Math.min(w, window.innerWidth * 0.85)) + "px");
  setW(pref("asideW", 560));
  split.onmousedown = e => {
    e.preventDefault();
    busyUI = true;
    split.classList.add("active");
    document.body.classList.add("resizing");
    const mv = ev => setW(window.innerWidth - ev.clientX - 4);
    const up = () => {
      document.removeEventListener("mousemove", mv);
      document.removeEventListener("mouseup", up);
      split.classList.remove("active");
      document.body.classList.remove("resizing");
      busyUI = false;
      setPref("asideW", parseInt(getComputedStyle(wrap).getPropertyValue("--aside-w")));
    };
    document.addEventListener("mousemove", mv);
    document.addEventListener("mouseup", up);
  };
  const dayBtns = document.querySelectorAll("[data-days]");
  const markDays = () => dayBtns.forEach(b => b.classList.toggle("on", Number(b.dataset.days) === NDAYS));
  dayBtns.forEach(b => b.onclick = () => { NDAYS = Number(b.dataset.days); setPref("days", NDAYS); markDays(); renderTimeline(); });
  markDays();
  const zoom = f => {
    const sc = document.getElementById("scroll"), mid = (sc.scrollTop + sc.clientHeight / 2) / PX;
    PX = Math.max(0.5, Math.min(PX * f, 3));
    setPref("px", PX);
    renderTimeline();
    sc.scrollTop = mid * PX - sc.clientHeight / 2;
  };
  document.getElementById("zin").onclick = () => zoom(1.25);
  document.getElementById("zout").onclick = () => zoom(0.8);
}

document.getElementById("q").oninput = renderBoard;
setupControls();
refresh().then(() => {
  const d = new Date();
  document.getElementById("scroll").scrollTop = Math.max(0, (d.getHours() * 60 + d.getMinutes() - 120) * PX);
});
setInterval(refresh, 15000);
</script>
</body>
